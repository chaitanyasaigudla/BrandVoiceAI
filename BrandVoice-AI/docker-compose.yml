services:
  # ─── PostgreSQL with pgvector ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: brandvoice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-brandvoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brandvoice_dev_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-brandvoice}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brandvoice} -d ${POSTGRES_DB:-brandvoice}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (session / queue) ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: brandvoice-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
